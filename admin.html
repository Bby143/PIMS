<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIMS Admin Dashboard</title><link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div id="loginView" class="page"><div class="card login-card">
<h1>PIMS Admin</h1><p class="muted">POGA International Management System</p>
<form id="loginForm">
<label>Email<input id="email" type="email" required></label>
<label>Password<input id="password" type="password" required></label>
<button type="submit">Sign in</button><p id="loginMessage" class="message"></p>
</form></div></div>

<div id="dashboardView" class="hidden">
<header class="topbar"><div><h1>PIMS Dashboard</h1><span>POGA International Management System</span></div><button id="logoutBtn" class="secondary">Logout</button></header>
<main class="container">
<section class="stats">
<div class="stat card"><strong id="totalCount">0</strong><span>Total Members</span></div>
<div class="stat card"><strong id="activeCount">0</strong><span>Active</span></div>
<div class="stat card"><strong id="locationCount">0</strong><span>Locations</span></div>
</section>
<section class="card filters"><input id="searchInput" type="search" placeholder="Search name or passport number">
<select id="locationFilter"><option value="">All Locations</option></select><button id="refreshBtn" class="secondary">Refresh</button></section>
<section class="card table-card"><div class="table-wrap"><table>
<thead><tr><th>Photo</th><th>Full Name</th><th>Location</th><th>Passport</th><th>Status</th><th>Date Registered</th><th>Actions</th></tr></thead>
<tbody id="membersBody"></tbody></table></div><p id="tableMessage" class="message"></p></section>
</main></div>

<div id="detailModal" class="modal hidden"><div class="modal-card"><button class="close" data-close="detailModal">×</button><div id="detailContent"></div></div></div>
<div id="editModal" class="modal hidden"><div class="modal-card"><button class="close" data-close="editModal">×</button><h2>Edit Member</h2>
<form id="editForm"><input id="editId" type="hidden">
<label>Full Name<input id="editFullName" required></label><label>Passport Number<input id="editPassport" required></label>
<label>Birthday<input id="editBirthday" type="date" required></label><label>Country / Location<select id="editCountry" required></select></label>
<label>Philippine Address<textarea id="editAddress" required></textarea></label><label>Contact Number<input id="editContact" required></label>
<label>Emergency Contact Person<input id="editEmergencyPerson" required></label><label>Emergency Contact Number<input id="editEmergencyNumber" required></label>
<label>Membership Status<select id="editStatus"><option>Active</option><option>Inactive</option></select></label>
<button type="submit">Save Changes</button><p id="editMessage" class="message"></p></form></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script>
</body></html>
